<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
.cat {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 28px 24px 24px;
  text-align: center;
  box-shadow: 0 2px 20px rgba(0,0,0,0.05);
  position: relative;
  cursor: pointer;
  transition: 0.2s;
}
.cat.active {
  border-color: var(--teal);
  box-shadow: 0 10px 30px rgba(74,124,126,0.16);
}
.cat.active::after {
  content: '';
  position: absolute;
  bottom: -21px; left: 50%;
  transform: translateX(-50%) rotate(45deg);
  width: 12px; height: 12px;
  background: #fff;
  border-right: 1px solid var(--teal);
  border-bottom: 1px solid var(--teal);
}
.cat-icon {
  width: 58px; height: 58px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: linear-gradient(145deg, #f2f8f8, #e4efef);
  display: flex; align-items: center; justify-content: center;
}
.cat-icon svg {
  width: 26px; height: 26px;
  stroke: var(--teal-dark);
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
.cat-name { font-size: 14.5px; font-weight: 400; letter-spacing: 0.08em; color: var(--ink); margin-bottom: 8px; }
.cat-price { font-family: 'Noto Serif JP', serif; font-size: 18px; color: var(--teal-dark); }
.cat-price small { font-size: 11px; color: #aaa; }
.detail {
  background: #fff;
  border: 1px solid var(--teal);
  border-radius: 10px;
  padding: 36px 44px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.05);
}
.detail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.detail-title { font-family: 'Noto Serif JP', serif; font-size: 19px; font-weight: 500; letter-spacing: 0.12em; color: var(--ink); }
.detail-badges { display: flex; gap: 8px; }
.badge.tax { background: #eef5f5; color: var(--teal-dark); }
.badge.note { background: #faf3ea; color: #b08950; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead tr { background: linear-gradient(135deg, var(--teal), var(--teal-dark)); color: #fff; }
th { padding: 13px 20px; font-weight: 400; letter-spacing: 0.1em; text-align: left; }
th:last-child { text-align: right; }
td { padding: 13px 20px; border-bottom: 1px solid #f0f0f0; }
td.price { text-align: right; font-size: 15px; }
td.price span { font-size: 11px; color: #aaa; margin-left: 2px; }
tr:last-child td { border-bottom: none; }
.detail-note { font-size: 12px; color: #aaa; margin-top: 14px; }
</style>
</head>
<body>
<section class="section">
  <p class="section-subtitle">Payroll &amp; Insurance</p>
  <h2 class="section-title">社会保険関係の料金</h2>
  <p class="section-desc">「いつ・何をするか」で選べる4カテゴリ。まずは目的のカードを選んでください。</p>

  <div class="cat-grid">
    <div class="cat">
      <div class="cat-icon">
        <!-- 電卓：給与計算 -->
        <svg viewBox="0 0 24 24">
          <rect x="5.5" y="3" width="13" height="18" rx="2"/>
          <line x1="8.5" y1="7" x2="15.5" y2="7"/>
          <line x1="8.7" y1="11.5" x2="8.7" y2="11.5"/>
          <line x1="12" y1="11.5" x2="12" y2="11.5"/>
          <line x1="15.3" y1="11.5" x2="15.3" y2="11.5"/>
          <line x1="8.7" y1="14.8" x2="8.7" y2="14.8"/>
          <line x1="12" y1="14.8" x2="12" y2="14.8"/>
          <line x1="15.3" y1="14.8" x2="15.3" y2="14.8"/>
          <line x1="8.7" y1="18" x2="12" y2="18"/>
          <line x1="15.3" y1="18" x2="15.3" y2="18"/>
        </svg>
      </div>
      <p class="cat-name">給与計算</p>
      <p class="cat-price">10,000<small>円/月〜</small></p>
    </div>
    <div class="cat active">
      <div class="cat-icon">
        <!-- カレンダー：年1回の手続き -->
        <svg viewBox="0 0 24 24">
          <rect x="3.5" y="5" width="17" height="15.5" rx="2"/>
          <line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/>
          <line x1="8" y1="3" x2="8" y2="6.5"/>
          <line x1="16" y1="3" x2="16" y2="6.5"/>
          <path d="M9 15 l2.2 2.2 L15.2 13"/>
        </svg>
      </div>
      <p class="cat-name">年1回の手続き</p>
      <p class="cat-price">5,000<small>円〜</small></p>
    </div>
    <div class="cat">
      <div class="cat-icon">
        <!-- ひと：入退社の手続き -->
        <svg viewBox="0 0 24 24">
          <circle cx="9.5" cy="8.5" r="3.2"/>
          <path d="M3.5 20 c0-3.6 2.7-6 6-6 s6 2.4 6 6"/>
          <circle cx="17" cy="9.5" r="2.4"/>
          <path d="M17.8 14.3 c1.9 0.7 3.2 2.6 3.2 5.7"/>
        </svg>
      </div>
      <p class="cat-name">入退社の手続き</p>
      <p class="cat-price">2,500<small>円〜</small></p>
    </div>
    <div class="cat">
      <div class="cat-icon">
        <!-- 建物：開業・廃業の手続き -->
        <svg viewBox="0 0 24 24">
          <path d="M5 21 V5.5 L12 3 l7 2.5 V21"/>
          <line x1="3" y1="21" x2="21" y2="21"/>
          <line x1="8.5" y1="8.5" x2="10.5" y2="8.5"/>
          <line x1="13.5" y1="8.5" x2="15.5" y2="8.5"/>
          <line x1="8.5" y1="12" x2="10.5" y2="12"/>
          <line x1="13.5" y1="12" x2="15.5" y2="12"/>
          <path d="M10.3 21 v-4 h3.4 v4"/>
        </svg>
      </div>
      <p class="cat-name">開業・廃業の手続き</p>
      <p class="cat-price">7,000<small>円〜</small></p>
    </div>
  </div>

  <div class="detail">
    <div class="detail-head">
      <h3 class="detail-title">社会保険 − 年1回の手続き</h3>
      <div class="detail-badges">
        <span class="badge tax">税抜表記</span>
        <span class="badge note">税務顧問先価格</span>
      </div>
    </div>
    <table>
      <thead><tr><th>手続き内容</th><th>料金</th></tr></thead>
      <tbody>
        <tr><td>社会保険 月額変更届</td><td class="price">5,000<span>円</span></td></tr>
        <tr><td>社会保険 賞与支払届</td><td class="price">5,000<span>円</span></td></tr>
        <tr><td>社会保険 算定基礎届</td><td class="price">20,000<span>円</span></td></tr>
        <tr><td>労働保険 年度更新</td><td class="price">20,000<span>円</span></td></tr>
      </tbody>
    </table>
    <p class="detail-note">※ 10人までの料金です。＋10人（端数切上）ごとに上記金額が加算となります。</p>
  </div>
</section>
</body>
</html>
