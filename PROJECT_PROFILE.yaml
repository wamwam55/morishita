    branch_prefix: codex/lane/
    isolated_worktrees: true
    lane_autopilot: true
    require_clean_ready: true
    require_merge_preview: true
    require_post_merge_tests: true
    auto_push: false
  autopilot:
    enabled: true
    agent: auto
    idle_after: 5m
    interval: 1m
    no_action_cooldown: 6h
    report: .ai/AUTOPILOT_REPORT.md
    auto_commit: false
    auto_push: false
  browser_automation: true
  autonomous_completion_before_handoff: true
  agent_checks_provider_dashboards: true
  browser_fallback_required: true
  browser_profile_selection: use_project_default
  default_browser_profile_id: PLACEHOLDER
  default_browser_profile:
    browser: chrome
    profile_label: PLACEHOLDER
    account_email: PLACEHOLDER
  browser_runbooks:
    - browser/GitHub.md
    - browser/Vercel.md
    - browser/Supabase.md
    - browser/Firebase.md
    - browser/Stripe.md
  stop_points:
    - identity_verification
    - payment
    - paid_plan_selection
    - captcha
    - two_factor_auth
    - sms_or_email_verification
    - terms_acceptance
    - secret_display

notification:
  enabled: false
  fallback: claude_code_only
  default_provider: webhook
  providers:
