version: v1.0.0-alpha
kind: project_state

project:
  name: PLACEHOLDER
  human_owner: PLACEHOLDER
  product_owner: PLACEHOLDER
  decision_maker: PLACEHOLDER

state:
  current: NEW
  previous: null
  paused_from: null
  allowed_states:
    - NEW
    - VISION
    - DESIGN
    - DESIGN_REVIEW
    - FROZEN
    - SETUP
    - DEVELOPMENT
    - REVIEW
    - DEPLOY
    - OPERATE
    - PAUSED
    - DONE
  last_event: null
  updated_at: PLACEHOLDER
  updated_by: PLACEHOLDER

roles:
  human:
    responsibility: CEO / Product Owner / Decision Maker
    approval_required_for:
      - vision
      - design
      - design_freeze
      - spec_freeze
      - deploy
      - operation_ready
      - done
      - identity_verification
      - payment
      - captcha
      - two_factor_auth
      - terms_acceptance
      - secret_input
  claude_code:
    responsibility: Tech Lead
    status: enabled
  codex:
    responsibility: Implementation Worker
    status: enabled
  computer_use:
    responsibility: Browser Operator
    status: enabled
  fable_advisor:
    responsibility: Architecture Advisor
    status: enabled

freeze:
  design:
    status: not_started
    approved_by: null
    approved_at: null
