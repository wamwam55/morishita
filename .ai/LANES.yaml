    name: PC通知「LINE · 森下 知幸」への本対応（第一返信…
    objective: |-
      PC通知「LINE · 森下　知幸」への本対応（第一返信は送信済み・相手への本回答までがこのタスク）
      - アプリ: LINE
      - 通知元: 森下　知幸
      - 件名: 森下　知幸
      - 本文: ネトフリのダウンタイム無茶おもろいよなぁ！

      この前の急遽用事は大丈夫やった❓
      - 受信日時: 2026-09-19T20:30:49.780Z

      【ルールの指示】
      通知内容を確認し、必要な対応を行ってください。対応結果もこのセッションへ報告してください。
      開始前にやる予定のことと完了後作業報告しておいて
      冒頭にmikanosAIからの返答ですって入れておいて
      なんか会計関連や仕事関連ってわかったら適切に最高レベルで対応してあげて
      ちなみ次動画修正きたら以下のメッセージのようなものをおくっておいて「
      なお動画の生成依頼および修正はこのセッションでの枠を使い切りました8月31日以降にご依頼(最大３つ veo3まで生成可能です) 　もしくは追加クレジットの購入をおねがいします。っていっておいて

      きちんと開始と完了の報告を本人にするように
      そしてより良い改善があれば報告するように

      【MIKANOS共通ルール: 対応後の再消化】
      対応や返信が終わったら、必ず次の2つをしてから終了すること。
      1) 同じトーク（会話）をもう一度開き直し、自分が作業していた間に相手から届いたメッセージが無いか確認する。あれば同じ方針でそのまま処理してから終わる。
      2) 最後に、相手のいない別のトーク（自分専用メモなど）を選択した状態にしてからアプリを離れる。
      理由: 開いて選択したままのトークにはmacOSの通知が出ない。MIKANOSは通知を入口にしているので、
      開きっぱなしのまま終わると、その相手の次のメッセージを構造的に取りこぼす（実測で発生済み）。
      取りこぼしを見つけた場合は、その内容を POST http://127.0.0.1:4180/api/pc-notifications/ingest
      （{"app":"LINE","sender":"<通知の送信者名>","title":"<同左>","body":"<本文>"}）へ入れ直せば、通常のルール経路で処理される。

      【本対応の完了条件】この通知には「確認しました、追って対応します」主旨の第一返信だけが送信済みで、相手はまだ本回答を待っています。上のルールの指示に沿って実際に調査・対応し、その結果を LINE の「森下　知幸」のスレッドを開き、開いた相手が通知元と一致していることを確認したうえで、相手に分かる言葉で必ず送信してください。自分の作業ログへ報告するだけで完了にしてはいけません（それは相手には届きません）。調査しても原因が確定しない・対応に時間がかかる場合も、その時点で分かったことと次の見込みを相手へ送ってから完了してください。相手やスレッドが特定できない・一致が確認できないときは送信せず、その理由を報告して停止してください。

      【MIKANOSの印・送る文すべてに必ず】相手へ送るメッセージは、本文のいちばん最後に 🍊 を1つ付けてください。第一返信も、本対応の返信も、訂正の文も、例外なく全部です。例:「承知しました、明日までに確認します🍊」。文中や先頭には入れず、末尾だけに1つです。すでに末尾が 🍊 なら足しません。MIKANOSが代わりに返したことを相手にも管理人にも分かるようにするための印なので、外さないでください。記帳（/api/messages/sent）へ渡す文面も、実際に送った通りに 🍊 を付けたまま渡してください。

      【送ったら必ず記帳】相手へメッセージを送ったら、そのつど次のコマンドで送った文面をMIKANOSへ記帳してください（第一返信も、そのあとの本対応の返信も、1通ずつ）。記帳しないと、MIKANOSのメッセージ画面には相手の発言だけが並び、あなたが返したことも、何と返したかも人に見えません。

      curl -sS -X POST http://127.0.0.1:4180/api/messages/sent -H 'content-type: application/json' -d '{"threadId":"thread_line_194545c7cc7b","body":"（実際に送った文面をそのまま）"}'

      送っていないのに記帳しないでください（画面上は送信済みなのに相手には届いていない、という取り返しのつかない食い違いになります）。記帳に失敗しても、送信済みのメッセージを取り消す必要はありません。その旨を報告してください。

      【対応の最後に必ず】送信確認・必要な取消・記帳・本対応がすべて終わったら、対象スレッドを表示したままにしないでください。別のスレッドへ移動するか、メッセージアプリを隠して（macOSは⌘H）、対象スレッドを非アクティブにしてください。開いたままだと同じ相手からの次の通知が抑制され、見落とすためです。
