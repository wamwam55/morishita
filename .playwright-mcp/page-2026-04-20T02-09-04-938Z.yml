    - generic [ref=e46]:
      - generic [ref=e47]:
        - generic [ref=e48]:
          - generic [ref=e51]: Our Mission
          - heading "皆様の良きパートナー" [level=3] [ref=e53]
          - paragraph [ref=e54]: 経営の3大要素「ヒト・モノ・カネ」を、 税務と労務のワンストップ体制で支える
          - paragraph [ref=e55]: 経営者の皆様が日々直面する課題は、大きく分けて「カネ」「ヒト」「モノ」の3つに集約されます。 当事務所は、税理士の本業を核としながら、社会保険労務士の知見を活かした手続き支援を組み合わせ、 これら経営課題を横断的にサポートいたします。
        - generic [ref=e56]:
          - generic [ref=e57]:
            - generic [ref=e58]:
              - img "税務・財務サポート" [ref=e59]
              - generic [ref=e60]: "01"
            - generic [ref=e61]:
              - generic [ref=e62]: カネ（税務・財務）
              - heading "経営の血液を守る" [level=4] [ref=e63]
              - paragraph [ref=e64]: 税理士として、当事務所が最も力を注ぐ領域です。 単なる記帳代行や申告書の作成に留まらず、月次決算を通じたキャッシュフローの可視化や、 中長期的な節税戦略を立案します。経営の「現在地」を正確な数字で把握し、 次の一手を見極めるための羅針盤として、財務面から事業の持続的成長を支えます。
          - generic [ref=e65]:
            - generic [ref=e66]:
              - img "社会保険・労務手続きサポート" [ref=e67]
              - generic [ref=e68]: "02"
            - generic [ref=e69]:
              - generic [ref=e70]: ヒト（社会保険・労務手続き）
              - heading "組織の土台を整える" [level=4] [ref=e71]
              - paragraph [ref=e72]: 組織を動かすのは「ヒト」ですが、それに伴う社会保険の加入・脱退手続きや各種届出は、 経営者にとって大きな事務負担となります。 当事務所では、税務顧問の枠組みの中で、社会保険の各種手続きまでワンストップで対応いたします。 税理士・社労士の両視点を持つことで、役員報酬の決定から社会保険料への影響までをトータルに管理し、 整合性の取れた確実な事務処理を実現します。
          - generic [ref=e73]:
            - generic [ref=e74]:
              - img "本業集中サポート" [ref=e75]
              - generic [ref=e76]: "03"
            - generic [ref=e77]:
              - generic [ref=e78]: モノ（事業・サービス）
              - heading "本業への集中環境を作る" [level=4] [ref=e79]
              - paragraph [ref=e80]: 経営者の貴重な時間は、本来、商品開発やサービス向上といった「モノ（本業）」に費やされるべきです。 バックオフィス業務である「カネ」と「ヒト」の手続きを一括して当事務所にお預けいただくことで、 経営者様が本業に100％集中できる環境を創出します。 事務作業の煩雑さから解放されることこそが、事業発展への近道であると私たちは確信しています。
      - generic [ref=e82]:
        - generic [ref=e84]:
          - img "代表税理士 森下知幸" [ref=e85]
          - generic [ref=e87]: Representative
        - generic [ref=e88]:
          - heading "代表税理士" [level=3] [ref=e89]
          - heading "森下 知幸" [level=4] [ref=e90]
          - paragraph [ref=e91]: 公務員として長く社会保険や年金の分野に携わり、「人」を支える制度の裏側を見てきました。 その中で、経営者の方々が労務だけでなく「資金繰りや税務」にも深く悩んでいる現実に触れ、 「お金と人の両面から経営者を直接支えられる存在になりたい」と強く考えるようになりました。
          - paragraph [ref=e92]: そこで一念発起して一から勉強を始め、税理士資格を取得しました。 自分自身も挑戦する立場だからこそ、不安や苦労を乗り越えて 今まさに努力されている経営者の方々の力になれると確信しています。
          - paragraph [ref=e93]:
            - text: 私が大切にしているのは、
            - strong [ref=e94]: 「挑戦する人のそばで、税務と労務の両輪で共に成長していくこと」
            - text: です。 労務の現場を知る税理士だからこそできる、数字だけではない血の通ったアドバイスを提供します。
